<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sermon Library</title>
<meta name="theme-color" content="#0b0c10">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Sermons">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="app.css">
</head>
<body>
<header class="top">
  <button class="icon-btn" id="back" aria-label="Back" hidden>&#8249;</button>
  <h1 id="title">Library</h1>
  <span class="top-sp"></span>
</header>

<main id="view" tabindex="-1"></main>

<div id="mini" hidden>
  <button id="mini-open" class="mini-info"><span class="av sm" id="mini-art"></span><span class="txt"><b id="mini-title"></b><span class="s" id="mini-sub"></span></span></button>
  <button id="mini-play" class="icon-btn round" aria-label="Play"></button>
  <div class="mini-bar"><i id="mini-prog"></i></div>
</div>

<nav class="tabs" aria-label="Sections">
  <button data-tab="listening" class="on"><svg viewBox="0 0 24 24"><path d="M12 2.5a9.5 9.5 0 1 0 0 19 9.5 9.5 0 0 0 0-19zm0 2a7.5 7.5 0 1 1 0 15 7.5 7.5 0 0 1 0-15z"/><path d="M10 8.2v7.6l6-3.8z"/></svg>Listening</button>
  <button data-tab="library"><svg viewBox="0 0 24 24"><path d="M4 4h3v16H4zM9 4h3v16H9zM14.5 4.6l2.9-.8 4.1 15.4-2.9.8z"/></svg>Library</button>
  <button data-tab="notes"><svg viewBox="0 0 24 24"><path d="M5 3h10l4 4v14H5zM14 4v4h4M8 12h8M8 16h8M8 8h4"/></svg>Notes</button>
  <button data-tab="stats"><svg viewBox="0 0 24 24"><path d="M4 20V10h3v10zM10.5 20V4h3v16zM17 20v-7h3v7z"/></svg>Stats</button>
  <button data-tab="more"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg>More</button>
</nav>

<div id="sheet" hidden><div class="sheet-card" role="dialog" aria-modal="true"></div></div>
<div id="toast" role="status" hidden></div>
<input type="file" id="file-in" multiple hidden>
<audio id="audio" preload="metadata"></audio>
<script src="app.js"></script>
</body>
</html>
